image disk.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition boot {
        image = "boot.vfat"
        partition-type-uuid = U
        bootable = true
    }

    partition rootfs {
        image = "rootfs.ext2"
        partition-type-uuid = L
    }
}

image boot.vfat {
    vfat {
        files = {
            "bzImage",
            "grub.cfg"
        }
    }
    size = 32M
}
